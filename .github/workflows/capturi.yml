name: Capturi

# Capturile de ecran ale aplicației (date inventate), generate cu Robolectric + Roborazzi.
# Rulează doar la cerere (workflow_dispatch, pe ramura dorită), ca să nu consume minute; imaginile sunt artefacte de 3 zile.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capturi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Capturi de ecran
        run: ./gradlew :app:testDebugUnitTest --tests 'ro.ak.sportshub.capturi.*' --stacktrace

      - name: Drumul focusului (testul de navigare)
        if: always()
        run: cat app/build/outputs/roborazzi/navigare.txt || true

      - name: Capturile ca artefact (3 zile)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturi
          path: app/build/outputs/roborazzi/*.png
          retention-days: 3
          if-no-files-found: warn

      - name: Capturile în jurnal (base64, pentru cine nu poate descărca artefactele)
        if: always()
        run: |
          for f in app/build/outputs/roborazzi/*.png; do
            [ -f "$f" ] || continue
            echo "=== CAPTURA $(basename "$f") ==="
            base64 -w 0 "$f"; echo
            echo "=== SFARSIT ==="
          done

      - name: Raportul testelor (dacă au picat)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raport-capturi
          path: app/build/reports/tests/
          retention-days: 3
