name: Build

# PR: teste + APK ca artefact de 3 zile, doar pentru PR-urile gata (nu ciorne), ca să nu consume minute la fiecare push.
# main: teste + APK publicat în release-ul unic „ultima-versiune” (fișierul vechi e înlocuit).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # doar pentru publicarea release-ului de pe main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cheia de semnare (din Secrets, dacă există)
        env:
          KEYSTORE_BASE64: ${{ secrets.AK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ak.jks"
            echo "AK_KEYSTORE_FILE=$RUNNER_TEMP/ak.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secretul AK_KEYSTORE_BASE64 lipsește: APK-ul e semnat cu o cheie temporară, deci actualizările peste versiunea instalată nu vor merge."
          fi

      - name: Teste și APK
        env:
          AK_KEYSTORE_PASSWORD: ${{ secrets.AK_KEYSTORE_PASSWORD }}
          AK_KEY_ALIAS: ${{ secrets.AK_KEY_ALIAS }}
          AK_KEY_PASSWORD: ${{ secrets.AK_KEY_PASSWORD }}
        run: |
          ./gradlew :core:common:test :core:playlist:test :core:epg:test :core:sports:test :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ak-sports-hub.apk
          ls -lh ak-sports-hub.apk

      - name: APK ca artefact (PR, 3 zile)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ak-sports-hub-apk
          path: ak-sports-hub.apk
          retention-days: 3
          compression-level: 0

      - name: Publică în „ultima-versiune”
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Titlul e citit de aplicație (actualizarea din aplicație): „v1.1.N (build N)”; „build N” e forma pe care o înțeleg și versiunile 1.0.
          titlu="AK Sports Hub v1.1.${{ github.run_number }} (build ${{ github.run_number }})"
          note="Construit automat din ${GITHUB_SHA::7}. Fișierul este înlocuit la fiecare build."
          if gh release view ultima-versiune --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload ultima-versiune ak-sports-hub.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit ultima-versiune --title "$titlu" --notes "$note" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          else
            gh release create ultima-versiune ak-sports-hub.apk --title "$titlu" --notes "$note" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
